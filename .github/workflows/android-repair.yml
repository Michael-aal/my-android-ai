name: Android Repair and Full Verification

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Clean generated build outputs before verification"
        required: true
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean, compile, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9 (repository has no Gradle wrapper)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle installation
        run: gradle --version

      - name: Clean generated outputs
        if: github.event_name != 'workflow_dispatch' || inputs.clean_build
        run: gradle --no-daemon clean

      - name: Compile all Android variants
        run: gradle --no-daemon assemble

      - name: Run unit tests
        run: gradle --no-daemon test

      - name: Run Android lint checks
        run: gradle --no-daemon lint

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-repair-reports
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/apk/**
