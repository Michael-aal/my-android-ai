name: Android Repair and Full Verification

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Clean generated build outputs before verification"
        required: true
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean, compile, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::Gradle wrapper ./gradlew is missing from the repository root."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Clean generated outputs
        if: github.event_name != 'workflow_dispatch' || inputs.clean_build
        run: ./gradlew --no-daemon clean

      - name: Compile all Android variants
        run: ./gradlew --no-daemon assemble

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Run Android lint checks
        run: ./gradlew --no-daemon lint

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-repair-reports
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/apk/**
