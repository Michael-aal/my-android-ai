name: Android Repair and Full Verification

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Clean generated build outputs before verification"
        required: true
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean, compile, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Clean generated outputs
        if: github.event_name != 'workflow_dispatch' || inputs.clean_build
        run: gradle --no-daemon clean

      - name: Compile safe and full-control APK variants
        run: gradle --no-daemon assembleSafeDebug assembleFullControlDebug

      - name: Run unit tests
        run: gradle --no-daemon test

      - name: Run Android lint checks
        run: gradle --no-daemon lint

      - name: Upload APKs and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-repair-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/**/*.apk
            **/build/reports/**
            **/build/test-results/**
