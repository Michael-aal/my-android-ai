name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build both variants
        run: gradle assembleSafeDebug assembleFullControlDebug
      - name: Upload safe APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-ai-safe-debug-apk
          path: app/build/outputs/apk/safe/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload full-control APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-ai-full-control-debug-apk
          path: app/build/outputs/apk/fullControl/debug/*.apk
          if-no-files-found: error
          retention-days: 14
